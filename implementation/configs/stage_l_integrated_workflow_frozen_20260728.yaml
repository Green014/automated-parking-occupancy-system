scope:
  stage: L
  purpose: >-
    Connect the strongest Part I-derived components into one auditable
    detector-to-slot workflow without modifying the frozen P0/P1/P2 results.
  primary_method: P3
  parameter_selection_from_stage_k: prohibited
  parameter_selection_from_virat: prohibited
  historical_artifact_overwrite: prohibited

method:
  id: P3
  name: D1 + B1 + E1b uncertainty gate + E4 + optional ByteTrack
  steps:
    - D1_NDISPark_finetuned_YOLOv8n
    - B1_polygon_coverage_one_to_one_mapping
    - E1b_MobileNetV3_CBAM_detector_negative_review
    - F2_asymmetric_uncertainty_gate
    - E4_asymmetric_EMA_hysteresis
    - E5_optional_ByteTrack_moving_vehicle_suppression
  detector_primary_rule: >-
    A mapped D1 vehicle is occupied and cannot be overturned by E1b.
  uncertainty_rule: >-
    A detector-negative slot is reviewed by E1b because absence of a mapped
    detection may indicate either a truly vacant slot or a missed vehicle.
  fusion_rule: >-
    Recover a detector-negative slot only when E1b occupied probability is
    at least 0.76. This is an asymmetric gate, not global score averaging.
  classifier_invocation: detector_negative_slots_only

