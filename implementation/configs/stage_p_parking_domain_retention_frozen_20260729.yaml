stage_name: Stage P — Parking-Domain Retention and Final Low-Light Occupancy Evidence
status: frozen_before_stage_p_predictions
frozen_on: "2026-07-29"

scope:
  allowed:
    - consumed-development NDISPark parking-domain detector comparison
    - training-resubstitution daylight box diagnostic
    - consumed night-validation box diagnostic
    - consumed post-hoc night count diagnostic
    - final night parking occupancy data gate
  prohibited:
    - retraining D1 or D1-LL
    - threshold, NMS, IoU, fusion, mapping, or temporal tuning
    - testing additional low-light enhancers, detectors, or trackers
    - calling confidence-truncated AP standard COCO AP
    - calling LMOT detection improvement parking occupancy improvement
    - calling an interface smoke an occupancy evaluation
    - overwriting Stage L, M, N, or O artifacts

