    used_by_D1_training: true
    used_by_D1_LL_training: true
  night_validation:
    images: 30
    boxes: 725
    role: consumed_development_diagnostic
    used_for_D1_epoch_or_model_evidence: true
    previously_consumed_by_stage_i: true
  night_test:
    images: 117
    vehicle_count_sum: 1402
    box_truth: false
    role: consumed_posthoc_count_diagnostic
    previously_consumed_by_stage_i: true
  slot_polygons_available: false
  per_slot_occupancy_truth_available: false

shared_inference:
  api: ultralytics.YOLO.predict
  imgsz: 640
  confidence: 0.30
  nms_iou: 0.70
  agnostic_nms: true
  max_detections: 300
  classes: [0]
  augment: false
  rect: false
  half: false
  batch: 1
  device: "0"
  model_track_prohibited: true
  threshold_reselection: prohibited

historical_protocol_conflict:
  old_ndispark_AP_confidence_floor: 0.001
  stage_p_frozen_confidence: 0.30
  resolution: >-
    Stage P follows the user-required Stage O/P3 operating threshold for both
    models. It does not reuse or compare directly with historical standard-like
    PR curves produced from the 0.001 confidence floor.

metrics:
  box_iou_thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  ap_semantics: confidence-truncated AP at the frozen confidence threshold of 0.30
  ap_not_standard_coco: true
  box:
    - precision
    - recall
    - confidence-truncated AP50 at the frozen confidence threshold of 0.30
    - confidence-truncated AP50-95 at the frozen confidence threshold of 0.30
    - ground_truth_boxes
    - predicted_boxes
    - true_positives
    - false_positives
    - false_negatives
  count: [MAE, RMSE, mean_predicted_count, mean_true_count, per_camera]
  runtime_descriptive_only: true
  unknown_truth_policy: exclude_and_count
  ignored_class_suppression:
    enabled: false
    reason: NDISPark train/validation evaluated truth contains only category 3 car and no ignore-region schema

retention_decision_rule:
  frozen_before_results: true
  required_night_improvement:
    any_of:
      - recall_gain_at_least: 0.02
      - confidence_truncated_AP50_gain_at_least: 0.02
  night_precision_drop_no_worse_than: 0.05
  night_AP50_95_drop_no_worse_than: 0.02
  daytime_training_resubstitution_max_drop:
    precision: 0.05
    recall: 0.05
    confidence_truncated_AP50: 0.05
    confidence_truncated_AP50_95: 0.05
  all_box_labelled_max_AP50_95_drop: 0.05
  count_test_max_increase:
    MAE: 0.50
    RMSE: 1.00
  outcomes:
    PASS: all available improvement and retention checks pass
    CONDITIONAL: night improvement and night precision checks pass, but a daytime, aggregate, or count retention check fails
    FAIL: night improvement or night precision/AP50-95 safety check fails
    BLOCKED: required local box data, model weights, or comparable settings are unavailable

p3_ll_gate:
  create_runtime_defaults_only_if:
    - retention_decision_is_PASS
    - new_final_night_parking_occupancy_data_gate_is_PASS
    - real_P3_D1_vs_P3_LL_occupancy_evidence_exists
  current_D1_LL_label: selected low-light detector candidate
  current_default_detector_change_authorized: false

execution:
  local_hardware_only: true
  A100_prohibited: true
  output_root_must_not_exist: true
  historical_artifact_overwrite: prohibited
  training_prohibited: true
