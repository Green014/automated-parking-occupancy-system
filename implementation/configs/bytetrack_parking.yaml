# ByteTrack parameters frozen for the pretrained parking-lot experiments.
# Detection confidence is 0.20, so track creation must not silently discard
# detections in the 0.20-0.25 confidence range.
tracker_type: bytetrack
track_high_thresh: 0.20
track_low_thresh: 0.08
new_track_thresh: 0.20
track_buffer: 30
match_thresh: 0.80
fuse_score: true
