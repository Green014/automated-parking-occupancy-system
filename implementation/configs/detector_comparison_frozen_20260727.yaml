common_inference:
  split: val
  imgsz: 640
  confidence_floor: 0.001
  nms_iou: 0.7
  max_detections: 300
  batch: 1
  single_class_evaluation: true
  augmentation: false
  rect: false
  half: false
  device: local_explicit_or_auto
  preprocessing: ultralytics_default_letterbox_same_version

metric_definitions:
  primary:
    - mAP50_95
    - recall
  secondary:
    - precision
    - mAP50
    - framework_pipeline_latency_ms_per_image
    - framework_pipeline_FPS
    - weights_bytes
    - parameter_count
  iou_thresholds:
    mAP50: 0.50
    mAP50_95: "0.50:0.05:0.95"
  latency_definition: Mean per-image sum of Ultralytics predict preprocess, inference, and postprocess speed fields.
  fps_definition: 1000 divided by framework_pipeline_latency_ms_per_image.
  evaluation_implementation: Filter source vehicle classes during prediction, map them to class 0 vehicle, then use one-to-one IoU matching and Ultralytics ap_per_class on the canonical detections.
  exclusions:
    - model_initialization_time
    - first_download_time
    - data_loading_time_outside_Ultralytics_speed

selection_policy:
  select_on: NDISPark_validation_consumed_development
  primary_order: [mAP50_95, recall]
  deployment_constraint: framework_pipeline_FPS
  test_counts_visible_during_selection: false
  slot_occupancy_results_visible_during_selection: false
  no_claim: Detector mAP improvement does not imply slot Macro F1 improvement.

qualitative_categories:
  - daylight
  - night
  - occlusion
  - small_vehicles
  - dense_or_overlapping_vehicles
  - false_positives
  - false_negatives
qualitative_scope_note: NDISPark validation directly supports night, occlusion, small/dense vehicles, FP, and FN review; daylight examples belong to training and cannot be validation metrics.

output_contract:
  root_must_not_exist: true
  top_level:
    - preflight.json
    - comparison.json
    - model_runtime_table.csv
  per_model:
    - metrics.json
    - runtime_metadata.json
    - detections.jsonl
    - PR_curve.png
    - F1_curve.png
    - P_curve.png
    - R_curve.png
    - confusion_matrix.png
    - confusion_matrix_normalized.png
  negative_results_retained: true
  partial_runs_not_presented_as_comparisons: true

runtime:
  python: 3.12.13
  torch: 2.13.0+cu130
  cuda: "13.0"
  ultralytics: 8.4.104
  opencv: 4.13.0
  device: NVIDIA GeForce RTX 3060 Laptop GPU
  vram_bytes: 6441926656

gates:
  preflight_must_pass_before_output_creation: true
  D1_missing_blocks_execute: true
  Stage_F_smoke_may_create_D1: true
  NDISPark_test_count_evaluation: blocked_until_detector_and_count_rule_are_selected
  paid_GPU: prohibited_without_user_approval
