  E0:
    canonical_name: Historical static external YOLOv8 coverage baseline
    runnable: false
    historical_aliases: [E0 YOLOv8 + official boxes]
    detector:
      family: YOLOv8
      implementation: literature_core.ClosedSetYOLODetector
      weights: ../yolov8n.pt
      confidence: 0.025
      image_size: 1280
      class_ids: [2, 3, 5, 7]
