    data_role: raw_temporal_comparator_for_future_protocol_frozen_video
    historical_config: literature_core/configs/temporal_e4_e5_frozen.yaml
    historical_outputs: literature_core/outputs/virat_temporal_case_study_*
    exclusions:
      - VIRAT 0503 is viewed/consumed and is not an untouched holdout
