      implementation: ultralytics_closed_set_yolo
      weights: yolov8n.pt
      confidence: 0.025
      image_size: 1280
      class_ids: [2, 3, 5, 7]
    mapping:
      type: slot_polygon_coverage
      one_to_one: true
      minimum_slot_coverage: 0.40
      evidence: detector_confidence_times_slot_coverage
    temporal:
      enabled: false
      tracking: false
    data_role: development_baseline_or_future_protocol_frozen_evaluation
    exclusions:
      - CNR-EXT is consumed and must not be used for new parameter selection
