    frozen_outputs: literature_core/outputs/cnrpark_ext_frozen_evaluation_20260725
    rerun_policy: historical_artifacts_only_no_parameter_selection

  T0:
    canonical_name: Raw YOLOv8 temporal comparator
    runnable: true
    pipeline_experiment: t0
    historical_aliases: [e0_raw]
    detector:
      family: YOLOv8
      implementation: ultralytics_closed_set_yolo
      weights: yolov8n.pt
      confidence: 0.20
      image_size: 640
      class_ids: [2, 3, 5, 7]
    mapping:
      type: slot_polygon_coverage
      one_to_one: true
      minimum_slot_coverage: 0.30
      evidence: detector_confidence_times_slot_coverage
    temporal:
      enabled: false
      tracking: false
      historical_note: >-
        The frozen VIRAT runner attached ByteTrack IDs to retained raw
