methods:
  B0:
    canonical_name: YOLOv8 bbox-centre mapping baseline
    runnable: true
    pipeline_experiment: b0
    detector:
      family: YOLOv8
      implementation: ultralytics_closed_set_yolo
      weights: yolov8n.pt
      confidence: 0.025
      image_size: 1280
      class_ids: [2, 3, 5, 7]
    mapping:
      type: bbox_centre_inside_slot_polygon
      one_to_one: true
      minimum_slot_coverage: null
      evidence: detector_confidence
    temporal:
      enabled: false
      tracking: false
    data_role: development_baseline_or_future_protocol_frozen_evaluation
