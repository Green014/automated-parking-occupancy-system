leakage_audit:
  exact_duplicate_images_across_splits: false
  camera_independent_split: false
  condition_independent_split: true
  finding: Six cameras occur in all three splits and camera 62 occurs in train and validation. The official split is a day-to-night condition split, not a new-camera test.
  controls:
    - Preserve the official train, validation, and test membership.
    - Treat validation as consumed development validation.
    - Do not select thresholds, epochs, or augmentations from test counts.
    - Report per-camera count metrics on test.
    - Do not report detector mAP on the count-only test split.

