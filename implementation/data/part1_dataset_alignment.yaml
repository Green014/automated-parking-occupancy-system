schema_version: 1
audit:
  id: PART1-DATASET-ALIGNMENT-20260727
  title: Part I Dataset Alignment Audit
  accessed_on: 2026-07-27
  status: complete_backup_route_selected_and_stage_C_frozen
  evidence_policy:
    - Prefer official dataset pages, papers, repositories, and deposited records.
    - A paper mentioning a dataset is not evidence that the data are public.
    - Download access is not treated as a reuse license.
    - Unknown fields remain unknown.
    - Parking-slot polygons are never converted into vehicle bounding-box truth.
    - Machine-generated boxes are never represented as manual ground truth.
  path_policy:
    source_cli: --source-root
    source_environment: PARKING_DATA_ROOT
    output_cli: --output-root
    committed_absolute_paths_allowed: false

local_audit:
  scope: ignored assets in the external original workspace
  checked_on: 2026-07-27
  path_recording_policy: Absolute user paths are deliberately not stored.
  holdings:
    pklot:
      status: partial
      evidence:
        - metadata file, 266961322 bytes
        - 27 development images from PUCPR, UFPR04, and UFPR05
      limitation: The official full-image archive is not local.
    cnrpark_ext:
      status: present_consumed
      evidence:
        - CNR-EXT full-image archive, 1104364544 bytes
        - official occupancy CSV, 18132695 bytes
        - 4081 evaluated frames and 144965 slot records
      limitation: The once-only external evaluation has already been consumed.
    ndispark:
      status: present
      evidence:
        - official archive, 118187828 bytes
        - 112 train images, 30 validation images, and 117 count-only test images
        - 2577 train boxes and 725 validation boxes
      limitation: Validation has already been used for development comparison.
    carpk_pucpr_plus:
      status: absent
    psex:
      status: absent
    lmot:
      status: absent
    aodraw:
      status: absent
    virat:
      status: partial_consumed_case_study
    grand_bassin:
      status: present_support_only

datasets:
  - id: PKLot
    part1_alignment:
      papers: [P17_APSD-OC, P18_Improved_MobileNetV3, P22_Optimizing_YOLOv8, P23_PKLot]
      method_categories: [slot_patch_classification, geometry_based_slot_occupancy]
      role: core_parking_occupancy
    official_sources:
      - title: PKLot official page
        url: https://web.inf.ufpr.br/luizoliveira/research-interests/pklot/
        accessed_on: 2026-07-27
      - title: PKLot official README
        url: https://www.inf.ufpr.br/lesoliveira/download/pklot-readme.pdf
        accessed_on: 2026-07-27
      - title: PKLot dataset paper
        url: https://www.inf.ufpr.br/lesoliveira/download/ESWA2015.pdf
        accessed_on: 2026-07-27
    version: official_archive_no_semantic_version
    license:
      status: verified
      name: Creative Commons Attribution 4.0 International
      url: https://creativecommons.org/licenses/by/4.0/
    local_status: partial
    scale:
      images: 12417
      image_resolution: 1280x720
      slot_instances: 695899
      cameras_or_views: 3
      acquisition: more_than_30_days_at_approximately_5_minute_intervals
      download: official_archive_3860376865_bytes
    annotations:
      vehicle_bounding_boxes: false
      masks: false
      counting_labels: derivable_from_slot_states_only
      parking_slot_polygons: true
      occupied_vacant_labels: true
      persistent_track_ids: false
      weather_lighting_tags: [sunny, overcast, rainy]
    viewpoint: [fixed_CCTV, overhead_high_angle, sRGB]
    official_split:
      type: day_disjoint_50_50_per_camera
      note: The paper requires all images from one day to stay in one side.
    leakage_risk: high_if_individual_frames_or_slot_patches_are_randomized
    task_fit:
      vehicle_detector_fine_tuning: unsuitable_no_vehicle_boxes
      slot_classifier_training: primary
      slot_occupancy_evaluation: primary
      low_light_adverse_evaluation: weather_only_no_night
      temporal_tracking_evaluation: unsuitable_sparse_snapshots_no_track_ids
    manual_annotation:
      needed_for_documented_roles: false
      needed_for_vehicle_detection: true
    risks:
      - Slot polygons and occupied labels are not vehicle boxes.
      - All three cameras have informed prior development; a new test can only use never-used date/image groups and is not a new-camera holdout.
      - Official README count is 12417 while an older project manifest recorded 12416; reconcile against the acquired archive before freezing.
    decision: acquire_full_archive_after_approval_for_grouped_slot_train_development_and_test

