dataset_to_task:
  vehicle_detector_fine_tuning:
    primary: [CARPK_official_train]
    supplemental: [NDISPark_train_verified_ODC_By]
    excluded: [PKLot, CNRPark-EXT, PSEX, LMOT, AODRaw, VIRAT_Ground_2, Grand_Bassin_Traffic]
  slot_classifier_training:
    primary: [PKLot_official_day_grouped_train]
    existing_artifact: [E1b_historical_PKLot_checkpoint]
    excluded: [CNRPark-EXT_consumed, CARPK_PUCPR_PLUS, NDISPark, PSEX_unavailable, LMOT, AODRaw]
  slot_occupancy_evaluation:
    development: [PKLot_never_test_design_groups]
    test: [PKLot_never_used_date_image_groups_pending_full_archive]
    historical_external_only: [CNRPark-EXT]
  low_light_adverse_evaluation:
    development_box_metrics: [NDISPark_validation_consumed_as_development]
    test_count_metrics: [NDISPark_test]
    reference_only: [LMOT, AODRaw, PSEX]
  temporal_tracking_evaluation:
    formal_test: []
    case_study_only: [VIRAT_Ground_2]
    development_stability_only: [Grand_Bassin_Traffic]

recommended_combination:
  name: CARPK_plus_NDISPark_with_PKLot_slot_protocol
  status: scientifically_recommended_but_not_selected
  requires_user_approved_acquisition: true
  components:
    detection_train:
      - CARPK official train after EULA
      - NDISPark train as a balanced fixed-camera supplement
    detection_validation:
      - source-grouped development subset carved only from CARPK official train
      - NDISPark 30-image night validation as a separately reported development stratum
    detection_test:
      - CARPK official 459-image test with boxes
      - NDISPark 117-image test for count MAE/RMSE only
    slot_classifier_train:
      - PKLot official day-disjoint training groups if retraining is justified
      - otherwise preserve the existing E1b checkpoint
    slot_occupancy_development:
      - never-test PKLot camera/date groups
    slot_occupancy_test:
      - never-used PKLot date/image groups frozen before P0/P1/P2 predictions
    temporal_test:
      - unavailable
    low_light_test:
      - NDISPark count-only test
  controls:
    - Keep source sampling counts and vehicle-box counts visible.
    - Map all accepted detection categories to one vehicle class.
    - Never use PUCPR+ in the primary detector protocol because it overlaps the PKLot PUCPR source.
    - Never use a test result for threshold, epoch, or model selection.

